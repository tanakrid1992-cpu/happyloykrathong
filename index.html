<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Loy Krathong · เทศบาลตำบลคลองตำหรุ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Charm:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1" rel="stylesheet">
<style>
@font-face{font-family:'FC Candy';src:url(fonts/FCCandyColor.otf) format('opentype');font-display:swap}
:root{--c1:#22d3ee;--c2:#a78bfa;--gold:#fbbf24;--glass:rgba(15,23,42,.55);--line:rgba(148,197,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;font-family:Kanit,sans-serif;color:#e2e8f0;background:radial-gradient(ellipse at 50% 110%,#1e3a8a 0%,#0b1230 45%,#05070f 100%)}
.ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;vertical-align:middle}
#fx{position:fixed;inset:0;pointer-events:none}
.bg{position:fixed;inset:0;background:url(images/bg.webp) no-repeat}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 75%,rgba(5,7,25,.35))}
.grid{position:fixed;left:-50%;right:-50%;bottom:0;height:42vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;animation:gm 4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
@keyframes gm{to{background-position:0 60px}}
.moon{position:fixed;top:9vh;right:7vw;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fff,#fde68a 60%,#f59e0b);box-shadow:0 0 80px 30px rgba(251,191,36,.35)}
.moon::after{content:"";position:absolute;inset:-22px;border:1px dashed rgba(251,191,36,.5);border-radius:50%;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* top bar */
.bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1180px,94vw);display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.logo .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 18px rgba(34,211,238,.6)}
.logo small{display:block;font-weight:300;font-size:11px;color:#94a3b8;letter-spacing:1px}
.sp{flex:1}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stat b{color:var(--c1);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
/* hero */
.hero{position:fixed;top:30vh;left:0;right:0;text-align:center;z-index:2}
.hero .tag{background:rgba(5,10,30,.6)!important;display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:2px;padding:4px 12px;border-radius:99px;border:1px solid rgba(34,211,238,.4);color:var(--c1);background:rgba(34,211,238,.08)}
.hero h1{font-weight:800;font-size:clamp(28px,4.6vw,60px);line-height:1.15;margin-top:6px;color:#fff6d6;text-shadow:0 2px 0 #b45309,0 4px 18px rgba(0,0,0,.85),0 0 30px rgba(251,191,36,.5)}
@keyframes gr{to{background-position:300%}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{display:flex;align-items:center;gap:5px;cursor:pointer;font:400 14px Kanit;color:#cbd5e1;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.25s}
.chip:hover{border-color:var(--c1);color:#fff;transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(167,139,250,.25));border-color:var(--c1);color:#fff;box-shadow:0 0 16px rgba(34,211,238,.35)}
/* stage */
.stage{position:fixed;inset:0;z-index:3;pointer-events:none}
.slot{position:absolute;transform:translateX(-50%);pointer-events:auto}
.slot:hover{z-index:50!important}
.slot.gone{visibility:hidden}
.p.w .ring{height:20px}
.p{position:relative;cursor:pointer;text-align:center;transform:translateY(-130vh);animation:fall 2.4s cubic-bezier(.22,.61,.36,1) forwards}
.p .in{position:relative;animation:bob 4s ease-in-out infinite}
.p img{height:calc(min(31vh,13vw)*var(--k,1));display:block;margin:auto;position:relative;z-index:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6));transition:.35s}

.ring{position:absolute;left:50%;bottom:-12px;width:75%;height:30px;transform:translateX(-50%);border-radius:50%;border:2px solid var(--c1);box-shadow:0 0 20px var(--c1),inset 0 0 20px var(--c1);opacity:.7}
.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--c2);animation:rp 2.4s ease-out infinite}
@keyframes rp{from{opacity:1;transform:scale(.8)}to{opacity:0;transform:scale(1.4)}}
.beam{position:absolute;left:50%;bottom:0;width:90%;height:100%;transform:translateX(-50%);background:linear-gradient(to top,rgba(34,211,238,.28),transparent 70%);clip-path:polygon(10% 100%,90% 100%,100% 0,0 0);opacity:0;transition:.35s}
.p:hover .beam{opacity:1}
.p:hover img{transform:translateY(-12px) scale(1.04);filter:drop-shadow(0 0 22px rgba(34,211,238,.7))}
.name{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;font-size:clamp(10px,1vw,14px);padding:5px 12px;border-radius:10px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);white-space:nowrap}
.name .ms{font-size:16px;color:var(--gold)}
.grp.m .name{white-space:normal;width:max-content;max-width:min(9vw,130px);text-align:center;justify-content:center;flex-wrap:wrap;line-height:1.25;gap:2px}
.tap{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:3px;font-size:12px;padding:3px 9px;border-radius:99px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0b1230;font-weight:600;animation:tb 1.6s ease-in-out infinite;opacity:0;transition:.3s}
.p:hover .tap{opacity:1}
@keyframes tb{50%{transform:translate(-50%,-6px)}}
@keyframes fall{from{transform:translateY(-130vh)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-7px)}}
/* overlay */
.ov{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,rgba(30,58,138,.5),rgba(2,6,23,.9));backdrop-filter:blur(6px);opacity:0;transition:opacity .5s}
.ov.show{opacity:1;pointer-events:auto;cursor:pointer}
.fly{position:fixed;z-index:11;pointer-events:none;transition:all .9s cubic-bezier(.5,0,.2,1)}
.fly img{height:100%;display:block;filter:drop-shadow(0 0 34px rgba(34,211,238,.6))}
.fly .hr{position:absolute;left:50%;bottom:-14px;width:85%;height:44px;transform:translateX(-50%);border-radius:50%;border:2px solid var(--c1);box-shadow:0 0 40px var(--c1),inset 0 0 26px var(--c1);opacity:0;transition:opacity .5s .7s}
.fly.on .hr{opacity:1}
.bless{position:fixed;left:50%;bottom:calc(66vh + 8px);transform:translate(-50%,20px);width:min(900px,92vw);text-align:center;z-index:12;opacity:0;transition:all .6s;pointer-events:none}
.bless.on{opacity:1;transform:translate(-50%,0)}
.bless .cap{font-family:'FC Candy',Charm,cursive;font-size:clamp(26px,3.6vw,52px);line-height:1.6;padding:.15em 0;color:#fde68a;text-shadow:0 2px 6px #000,0 0 26px rgba(251,191,36,.7)}
.bless .who{display:inline-block;margin-top:4px;font-size:clamp(13px,1.3vw,17px);font-weight:500;color:#fff;padding:5px 16px;border-radius:99px;background:rgba(8,12,40,.6);border:1px solid rgba(251,191,36,.6)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);padding:10px 18px;border-radius:12px;background:#0f172a;border:1px solid var(--c1);z-index:20;transition:.35s;display:flex;gap:6px;align-items:center}
.toast.s{transform:translate(-50%,0)}
@media(max-width:760px){.bar .stat.h{display:none}.hero{top:80px}}
</style></head><body>
<div class="bg"></div><canvas id="fx"></canvas>
<div class="hero">
 <h1>สุขสันต์วันลอยกระทง</h1>
</div>
<div class="stage" id="stage"></div>
<div class="ov" id="ov"></div>
<div class="bless" id="bless"><div class="cap" id="cap"></div><div class="who" id="who"></div></div>
<div class="toast" id="toast"><span class="ms" style="color:#22c55e">check_circle</span>คัดลอกแล้ว</div>

function burst(cx,cy,n){const cs=['#22d3ee','#a78bfa','#fbbf24','#f472b6','#fff'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*6+2;B.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:cs[i%5],r:Math.random()*3+1})}}
function loop(T){x.clearRect(0,0,W,H);
 P.forEach(p=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(T/900+p.t));x.fillStyle='#e0f2fe';x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fill()});

 B=B.filter(b=>b.l>0);B.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.vx*=.98;b.l-=.016;x.globalAlpha=b.l;x.fillStyle=b.c;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});
